<!DOCTYPE html>
<html>
<head>
    <title>Packages</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>💼 Travel Packages</h2>

<div id="packages"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const destination = urlParams.get("destination");

const packages = [
    {name: "Budget Package", price: "₹5000"},
    {name: "Standard Package", price: "₹10000"},
    {name: "Luxury Package", price: "₹20000"}
];

let html = `<h3>Packages for ${destination}</h3>`;

packages.forEach(p => {
    html += `<p>${p.name} - ${p.price}</p>`;
});

document.getElementById("packages").innerHTML = html;
</script>

</body>
</html>
