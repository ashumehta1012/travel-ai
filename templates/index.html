<!DOCTYPE html>
<html>
<head>
    <title>AI Travel Planner</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            text-align: center;
        }
        .container {
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }
        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
        }
        pre {
            text-align: left;
            background: #eee;
            padding: 10px;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AI Travel Planner ✈️</h2>

    <input id="destination" placeholder="Destination (e.g. Manali)">
    <input id="days" placeholder="Days (e.g. 3)">
    <input id="budget" placeholder="Budget (e.g. 10000)">
    <input id="interests" placeholder="Interests (mountains, food)">

    <button onclick="generate()">Generate Plan</button>

    <pre id="result"></pre>
</div>

<script>
async function generate() {
    const res = await fetch("/generate", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            destination: document.getElementById("destination").value,
            days: document.getElementById("days").value,
            budget: document.getElementById("budget").value,
            interests: document.getElementById("interests").value
        })
    });

    const data = await res.json();
    document.getElementById("result").innerText = data.result;
}
</script>

</body>
</html>
