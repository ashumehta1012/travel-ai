<!DOCTYPE html>
<html>
<head>
    <title>AI Travel Planner</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 50px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            text-align: left;
            white-space: pre-wrap;
        }

        .loading {
            color: gray;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>AI Travel Planner ✈️</h2>

    <input type="text" id="destination" placeholder="Destination (e.g. Manali)">
    <input type="number" id="days" placeholder="Days (e.g. 3)">
    <input type="number" id="budget" placeholder="Budget (e.g. 10000)">
    <input type="text" id="interests" placeholder="Interests (mountains, food)">

    <button onclick="generatePlan()">Generate Plan</button>

    <div id="result"></div>
</div>

<script>
async function generatePlan() {
    const destination = document.getElementById("destination").value;
    const days = document.getElementById("days").value;
    const budget = document.getElementById("budget").value;
    const interests = document.getElementById("interests").value;

    document.getElementById("result").innerHTML = "<p class='loading'>Generating your trip...</p>";

    const response = await fetch("/generate", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            destination: destination,
            days: days,
            budget: budget,
            interests: interests
        })
    });

    const data = await response.json();

    document.getElementById("result").innerHTML = `
        <h3>Your Travel Plan:</h3>
        <pre>${data.result}</pre>
    `;
}
</script>

</body>
</html>
