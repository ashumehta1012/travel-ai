<!DOCTYPE html>
<html>
<head>
    <title>Plan Trip</title>
</head>

<body style="text-align:center; font-family:Arial;">

<h2>✈️ Plan Your Trip</h2>

<input id="days" placeholder="Days"><br><br>
<input id="budget" placeholder="Budget"><br><br>
<input id="interests" placeholder="Interests"><br><br>

<button onclick="generate()">Generate AI Plan</button>

<div id="result"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const destination = urlParams.get("destination");

async function generate() {
    document.getElementById("result").innerHTML = "Generating...";

    const res = await fetch("/generate", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            destination: destination,
            days: document.getElementById("days").value,
            budget: document.getElementById("budget").value,
            interests: document.getElementById("interests").value
        })
    });

    const data = await res.json();

    document.getElementById("result").innerHTML = `
        <h3>${destination} Plan</h3>
        <pre>${data.plan}</pre>
        <br>
        <button onclick="goToPackages()">View Packages</button>
    `;
}

function goToPackages() {
    window.location.href = "/packages?destination=" + destination;
}
</script>

</body>
</html>
